<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Primeros Auxilios</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--sep:#38383a;
  --lbl:#fff;--lbl2:rgba(235,235,245,.62);--lbl3:rgba(235,235,245,.3);
  --red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--green:#30d158;--mint:#63e6e2;
  --teal:#40c8e0;--cyan:#64d2ff;--blue:#0a84ff;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;
  --v:#e5e5ea;--v2:#aeaeb2;--r:#64d2ff;--r2:#0a84ff;--ink:#000;
  --spring:cubic-bezier(.32,.72,0,1);
  --pop:cubic-bezier(.34,1.56,.64,1);
  --c:var(--blue);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--lbl);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1c1c1e,#000 70%)}
  #app{width:393px;height:min(852px,94vh);border-radius:54px;box-shadow:0 0 0 11px #1c1c1e,0 0 0 13px #3a3a3c,0 40px 120px rgba(0,0,0,.8)}
}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}

/* ---------- Home ---------- */
.hh{padding:calc(env(safe-area-inset-top) + 22px) 20px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hh h1{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.1}
.hh p{color:var(--lbl2);font-size:15px;margin-top:2px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:8px 16px 10px}
.tile{position:relative;background:var(--bg2);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:84px;
  transition:transform .35s var(--spring),background .2s;animation:tileIn .6s var(--spring) both}
.tile:active{transform:scale(.95);background:var(--bg3);transition-duration:.12s}
.tile .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 20%,transparent)}
.tile .ico svg{width:26px;height:26px}
.tile span{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.15}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;background:var(--red)}
.tile.wide .ico{background:rgba(255,255,255,.22)}
.tile.wide span{font-size:20px;font-weight:700}
.tile.wide small{margin-left:auto;font-size:13px;font-weight:600;opacity:.85}
.tile.wide:active{background:#d63a31}
.tile.red{background:var(--red)}.tile.red .ico{background:rgba(255,255,255,.22)}.tile.red:active{background:#d63a31}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.foot{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 16px 6px;flex-wrap:wrap}
.foot select,.foot button{font:inherit;font-size:13px;color:var(--lbl2);background:var(--bg2);border:0;border-radius:10px;padding:6px 10px;-webkit-appearance:none;appearance:none}
.foot b{color:var(--lbl)}
.chip.big{font-size:22px;padding:8px 16px}
.chip.big svg{width:20px;height:20px}
.disc{text-align:center;color:var(--lbl3);font-size:11px;padding:0 20px calc(env(safe-area-inset-bottom) + 12px)}

/* ---------- 112 button ---------- */
.b112{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--red);color:#fff;
  font-weight:700;font-size:17px;text-decoration:none;flex:none;transition:transform .3s var(--spring)}
.b112:active{transform:scale(.92)}
.b112 svg{width:18px;height:18px}
.b112.big{height:44px;font-size:19px;padding:0 18px 0 14px;border-radius:22px;box-shadow:0 0 0 0 rgba(255,69,58,.6);animation:sos 2.2s infinite}
@keyframes sos{0%{box-shadow:0 0 0 0 rgba(255,69,58,.55)}70%,100%{box-shadow:0 0 0 14px rgba(255,69,58,0)}}

/* ---------- Step ---------- */
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) 12px 6px}
.back{display:flex;align-items:center;gap:2px;color:var(--c);font-size:17px;height:40px;padding:0 6px 0 2px;border-radius:12px;transition:opacity .2s}
.back:active{opacity:.4}
.back svg{width:24px;height:24px}
.ttl{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:20px;background:var(--bg2);display:grid;place-items:center;flex:none;transition:transform .3s var(--spring)}
.ib:active{transform:scale(.88)}
.ib svg{width:20px;height:20px}
.prog{display:flex;gap:5px;padding:6px 20px 0}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--spring)}
.prog i.on::after{transform:scaleX(1)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 0}
.art{flex:1;min-height:0;border-radius:28px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c) 14%,transparent),transparent 65%)}
.art svg{position:relative;width:100%;height:100%;max-height:46vh;animation:artIn .7s var(--spring) both}
.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:artIn .7s var(--spring) both;background:#1c1c1e}
.art::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
.ov{position:absolute;inset:12px;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:18px;background:rgba(28,28,30,.62);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  color:#fff;font-weight:700;font-size:16px;letter-spacing:-.2px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset;animation:chipIn .6s var(--pop) .35s both}
.chip.y{background:rgba(255,214,10,.92);color:#000}.chip.r{background:rgba(255,69,58,.92)}
.chip svg{width:18px;height:18px}
.chiprow{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.inset{position:absolute;right:12px;top:12px;width:34%;aspect-ratio:1;border-radius:22px;background:rgba(28,28,30,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:chipIn .6s var(--pop) .4s both;overflow:hidden}
.inset svg{width:100%;height:100%;max-height:none}
.ring10{width:54px;height:54px;border-radius:27px;background:rgba(28,28,30,.62);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;position:relative;animation:chipIn .6s var(--pop) .35s both}
.ring10 svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring10 b{font-size:17px;font-variant-numeric:tabular-nums}
@keyframes chipIn{from{opacity:0;transform:scale(.7)}}
@keyframes artIn{from{opacity:0;transform:scale(.94)}}
.txt{display:flex;gap:14px;align-items:flex-start;padding:18px 4px 4px;animation:txtIn .6s var(--spring) .08s both}
@keyframes txtIn{from{opacity:0;transform:translateY(10px)}}
.num{flex:none;width:36px;height:36px;border-radius:18px;background:var(--c);color:#000;font-weight:700;font-size:18px;display:grid;place-items:center;margin-top:2px}
.txt h2{font-size:clamp(24px,7.2vw,30px);font-weight:700;letter-spacing:-.4px;line-height:1.1}
.txt p{color:var(--lbl2);font-size:17px;line-height:1.3;margin-top:5px;letter-spacing:-.2px}
.link{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 4px 0;height:50px;border-radius:14px;background:color-mix(in srgb,var(--lc,var(--red)) 18%,transparent);color:var(--lc,var(--red));font-weight:600;font-size:17px;transition:transform .3s var(--spring)}
.link:active{transform:scale(.97)}
.nav{display:flex;gap:10px;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px)}
.nav button{height:60px;border-radius:18px;font-size:19px;font-weight:600;transition:transform .35s var(--spring),opacity .2s}
.nav button:active{transform:scale(.95)}
.nav .prev{width:60px;background:var(--bg2);display:grid;place-items:center}
.nav .prev svg{width:26px;height:26px}
.nav .prev[disabled]{opacity:.3}
.nav .next{flex:1;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;gap:6px}
.nav .next svg{width:22px;height:22px}

/* ---------- Choice ---------- */
.choice{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px)}
.choice h2{font-size:34px;font-weight:700;letter-spacing:-.5px;text-align:center;line-height:1.1;animation:txtIn .6s var(--spring) both}
.choice .hint{text-align:center;color:var(--lbl2);font-size:17px;margin:-4px 0 12px;animation:txtIn .6s var(--spring) .05s both}
.opt{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:26px;background:var(--bg2);text-align:left;min-height:110px;
  transition:transform .35s var(--spring);animation:tileIn .6s var(--spring) both}
.opt:active{transform:scale(.96)}
.opt .oi{width:72px;height:72px;border-radius:20px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--oc) 22%,transparent)}
.opt .oi svg{width:52px;height:52px}
.opt b{display:block;font-size:30px;font-weight:700;color:var(--oc);letter-spacing:-.4px}
.opt small{display:block;font-size:16px;color:var(--lbl2);margin-top:2px}

/* ---------- Metronome ---------- */
.metro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:28px;background:var(--bg2);position:relative;overflow:hidden}
.beat{position:relative;width:min(62vw,240px);aspect-ratio:1;display:grid;place-items:center}
.beat .ringb{position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--red) 18%,transparent)}
.beat .core{position:absolute;inset:14%;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,69,58,.45)}
.beat .cnt{font-size:clamp(64px,20vw,88px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px;color:#fff}
.mlbl{font-size:26px;font-weight:700;letter-spacing:4px}
.msub{color:var(--lbl2);font-size:15px;text-align:center;padding:0 20px;line-height:1.35}
.mtime{position:absolute;top:14px;left:16px;font-variant-numeric:tabular-nums;color:var(--lbl2);font-size:15px;font-weight:600}
.mmute{position:absolute;top:10px;right:10px}

/* ---------- Timer ---------- */
.timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:28px;background:var(--bg2)}
.tring{position:relative;width:min(62vw,240px);aspect-ratio:1}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .tv{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(52px,16vw,68px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer .alert{opacity:0;transform:scale(.9);transition:all .5s var(--pop)}
.timer.late .alert{opacity:1;transform:none}
.timer.late .tv{color:var(--red)}

/* ---------- Done ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 28px;text-align:center}
.done svg{width:130px;height:130px}
.done h2{font-size:30px;font-weight:700;letter-spacing:-.4px;margin-top:10px;animation:txtIn .6s var(--spring) .5s both}
.done p{color:var(--lbl2);font-size:17px;animation:txtIn .6s var(--spring) .6s both}
.done .nav{width:100%;padding:24px 0 0;animation:txtIn .6s var(--spring) .7s both}

/* ---------- SVG anims ---------- */
svg [style*="animation"]{transform-box:fill-box;transform-origin:center}
svg text{font-family:inherit}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes cpr{0%,100%{transform:translateY(0)}35%{transform:translateY(9px)}}
@keyframes cprchest{0%,100%{transform:scaleY(1)}35%{transform:scaleY(.8)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ring{0%,55%,100%{transform:rotate(0)}8%,24%,40%{transform:rotate(-7deg)}16%,32%,48%{transform:rotate(7deg)}}
@keyframes wave{0%{opacity:0;transform:scale(.8)}35%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flicker{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.9)}}
@keyframes away{0%,15%{transform:translateX(0)}65%,100%{transform:translateX(34px)}}
@keyframes ringoff{0%,20%{transform:translateY(0);opacity:1}75%{transform:translateY(-58px);opacity:1}100%{transform:translateY(-58px);opacity:0}}
@keyframes slidein{0%,12%{transform:translateY(-40px);opacity:0}55%,100%{transform:none;opacity:1}}
@keyframes s1{0%{opacity:0;transform:translateY(-14px)}10%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes s2{0%,25%{opacity:0;transform:translateY(-14px)}35%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes s3{0%,48%{opacity:0;transform:translateY(-14px)}58%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes s4{0%,70%{opacity:0;transform:translateY(-14px)}80%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes twist{0%,15%{transform:rotate(0)}50%,70%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes cover{0%,15%{transform:translateY(-60px);opacity:0}55%,100%{transform:none;opacity:1}}
@keyframes tilt{0%,15%{transform:rotate(0)}45%,85%{transform:rotate(-20deg)}100%{transform:rotate(0)}}
@keyframes air{0%,15%{stroke:#ff453a}45%,85%{stroke:#30d158}100%{stroke:#ff453a}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.16)}}
@keyframes armout{0%,15%{transform:rotate(90deg)}50%,100%{transform:rotate(0)}}
@keyframes late{0%,52%{opacity:0;transform:scale(.6)}65%,100%{opacity:1;transform:none}}
@keyframes roll{0%,15%{transform:scaleX(1)}55%,100%{transform:scaleX(.42) translateX(40px)}}
@keyframes hit{0%,100%{transform:rotate(14deg)}40%{transform:rotate(0)}}
@keyframes bhit{0%,100%{transform:translateY(-16px)}40%{transform:translateY(0)}}
@keyframes thrust{0%,100%{transform:translate(0,0)}35%{transform:translate(6px,-7px)}}
@keyframes drift{0%,20%{transform:rotate(0)}65%,85%{transform:rotate(38deg)}100%{transform:rotate(0)}}
@keyframes droop{0%,20%{transform:rotate(0)}55%,85%{transform:rotate(22deg)}100%{transform:rotate(0)}}
@keyframes jitter{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-5deg)}50%{transform:translate(2px,-1px) rotate(4deg)}75%{transform:translate(1px,2px) rotate(-3deg)}}
@keyframes outl{0%,20%{transform:translateX(0);opacity:1}65%,100%{transform:translateX(-28px);opacity:.25}}
@keyframes outr{0%,20%{transform:translateX(0);opacity:1}65%,100%{transform:translateX(28px);opacity:.25}}
@keyframes draw{0%,12%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes ringprog{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
@keyframes burst{0%,30%{opacity:0;transform:scale(.4)}42%{opacity:1;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.35)}}
@keyframes blink{50%{opacity:.25}}
@keyframes drop{0%,10%{transform:translateY(-50px);opacity:0}45%,100%{transform:none;opacity:1}}
@keyframes openl{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-24deg)}}
@keyframes openr{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(24deg)}}
@keyframes pop{0%,20%{transform:translate(0,0);opacity:1}60%,100%{transform:translate(18px,-18px);opacity:0}}
@keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes checkdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes circlepop{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){svg *{animation-duration:0s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="i18n.js"></script>
<script>
/* =============== SVG toolkit =============== */
const C={v:'#e5e5ea',v2:'#aeaeb2',v3:'#8e8e93',r:'#64d2ff',r2:'#0a84ff',red:'#ff453a',dred:'#c7302a',grn:'#30d158',yel:'#ffd60a',org:'#ff9f0a',blu:'#64d2ff',ink:'#000',gr:'#3a3a3c',wh:'#fff',pur:'#bf5af2'};
const an=(n,d=1.2,o='',del=0,t='ease-in-out')=>`style="animation:${n} ${d}s ${t} ${del}s infinite both${o?`;transform-box:view-box;transform-origin:${o}`:''}"`;
const ln=(d,c,w,x='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const ground=(y=142)=>ln(`M12 ${y}H228`,C.gr,3);
const xb=(x,y,r=15)=>`<g ${an('pulse',1.4)}><circle cx="${x}" cy="${y}" r="${r}" fill="${C.red}" stroke="#1c1c1e" stroke-width="3"/>${ln(`M${x-r*.38} ${y-r*.38}L${x+r*.38} ${y+r*.38}M${x+r*.38} ${y-r*.38}L${x-r*.38} ${y+r*.38}`,'#fff',r*.26)}</g>`;
const okb=(x,y,r=15)=>`<g ${an('pulse',1.4)}><circle cx="${x}" cy="${y}" r="${r}" fill="${C.grn}" stroke="#1c1c1e" stroke-width="3"/>${ln(`M${x-r*.42} ${y}L${x-r*.1} ${y+r*.32}L${x+r*.45} ${y-r*.34}`,'#fff',r*.24)}</g>`;
const pill=(x,y,t,bg=C.yel,fg=C.ink,fs=15)=>{const w=t.length*fs*.64+24;return `<g><rect x="${x-w/2}" y="${y-fs*.95}" width="${w}" height="${fs*1.9}" rx="${fs*.95}" fill="${bg}"/><text x="${x}" y="${y+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${fg}">${t}</text></g>`};
const clock=(x,y,r,label,d=4)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="#000" stroke="${C.v}" stroke-width="3.5"/><rect x="${x-5}" y="${y-r-8}" width="10" height="6" rx="2" fill="${C.v}"/>${ln(`M${x} ${y}V${y-r+7}`,C.yel,3.5,an('spin',d,`${x}px ${y}px`,0,'linear'))}<circle cx="${x}" cy="${y}" r="3" fill="#fff"/>${label?`<text x="${x}" y="${y+r+19}" text-anchor="middle" font-size="15" font-weight="700" fill="${C.v}">${label}</text>`:''}</g>`;
const arm=(y=112,h=40)=>`<rect x="16" y="${y}" width="208" height="${h}" rx="${h/2}" fill="${C.v}"/>`;
const drops=(xs,y)=>xs.map((x,i)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="${C.red}" ${an('drip',1.5,'',i*.5,'ease-in')}/>`).join('');
const lying=(dx=0,dy=0)=>`<g transform="translate(${dx} ${dy})"><circle cx="42" cy="126" r="15" fill="${C.v}"/><rect x="58" y="113" width="84" height="27" rx="12" fill="${C.v}"/><rect x="138" y="118" width="86" height="18" rx="9" fill="${C.v}"/></g>`;
const person=(cx,b,f)=>`<circle cx="${cx}" cy="${b-122}" r="15" fill="${f}"/><rect x="${cx-17}" y="${b-102}" width="34" height="58" rx="14" fill="${f}"/><rect x="${cx-15}" y="${b-50}" width="13" height="50" rx="6.5" fill="${f}"/><rect x="${cx+2}" y="${b-50}" width="13" height="50" rx="6.5" fill="${f}"/>`;
const bubble=(x,y,w,h,t,fs=17,tx)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="#fff"/><path d="M${tx??x+22} ${y+h-2}l-4 14 16-14z" fill="#fff"/><text x="${x+w/2}" y="${y+h/2+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#000">${t}</text></g>`;

let LANG=detectLang(), NUMBER=detectNumber(), L=LANGS[LANG], U=L.ui, O=L.ov;
const fmt=t=>(t||'').replace(/\{N\}/g,NUMBER);
function hydrate(){
  L=LANGS[LANG];U=L.ui;O=L.ov;
  document.documentElement.lang=LANG;
  for(const [id,p] of Object.entries(P)){
    const [label,title,steps]=L.p[id];
    if(label)p.label=fmt(label);
    p.title=fmt(title);
    p.steps.forEach((st,i)=>{
      const [t,sub,x]=steps[i];
      st.t=fmt(t);st.s=fmt(sub);
      if(st.opts)st.opts.forEach((o,k)=>{o.l=x[k][0];o.d=x[k][1]});
      if(st.link&&x)st.link.l=fmt(x);
    });
  }
}
hydrate();

  nohold:()=>`<span class="chip r">${xI}${O.nohold}</span>`, still:()=>`<span class="chip r">${xI}${O.nomove}</span>`,
  cushion:()=>`<span class="chip r">${xI}${O.nomouth}</span>`,
  bad:()=>`<span class="chip r big">${phI}${NUMBER}</span><div class="chiprow">${O.bad.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`,
  face:()=>`<div class="inset"><svg viewBox="0 0 240 200">${A.face()}</svg></div>`,
  speech:()=>`<div class="inset"><svg viewBox="0 0 240 200">${A.speech()}</svg></div>`,
  armsup:()=>`<span class="chip">${O.armsup}</span>`,
  shake:()=>`<span class="chip">${O.shake}</span>`, shout:()=>`<span class="chip">${O.shout}</span>`,
  call:()=>`<span class="chip r big">${phI}${NUMBER}</span><span class="chip">${O.speaker}</span>`, aed:()=>`<span class="chip">${O.aed}</span>`,
};
const REP={repeat:{atrA:['back','abdo'],atrB:['bback','bchest']}};
const ORDER=['sangrado','quemadura','caida','inconsciente','atragantamiento','pecho','alergia','convulsion','ictus','rcp'];

/* =============== Router + push transitions =============== */
const app=document.getElementById('app');
let cur=history.state?.n||0, cleanup=[];
let voice=(()=>{try{return localStorage.getItem('pa-voice')!=='0'}catch{return true}})();
const b112=(big)=>`<a class="b112 ${big?'big':''}" href="tel:${NUMBER}">${I.phone}${NUMBER}</a>`;
function nav(h){history.pushState({n:++cur},'',h);render(1)}
addEventListener('popstate',e=>{const n=e.state?.n||0;const d=n<cur?-1:1;cur=n;render(d)});
function parse(){const [,id,st]=(location.hash||'').split('/');return {id:P[id]?id:null,i:Math.max(0,parseInt(st)||0)}}

function show(html,dir,color){
  cleanup.forEach(f=>f());cleanup=[];stopVoice()
  const old=app.querySelector('.view:last-child');
  const v=document.createElement('div');v.className='view';v.innerHTML=html;
  if(color)v.style.setProperty('--c',color);
  app.appendChild(v);
  if(old&&dir){
    const E={duration:520,easing:'cubic-bezier(.32,.72,0,1)'};
    if(dir>0){
      v.animate([{transform:'translateX(100%)'},{transform:'none'}],E);
      old.animate([{transform:'none',filter:'brightness(1)'},{transform:'translateX(-30%)',filter:'brightness(.5)'}],E);
    }else{
      app.insertBefore(v,old);
      v.animate([{transform:'translateX(-30%)',filter:'brightness(.5)'},{transform:'none',filter:'brightness(1)'}],E);
      old.animate([{transform:'none'},{transform:'translateX(100%)'}],E);
      old.style.zIndex=2;
    }
    setTimeout(()=>old.remove(),530);
  }else if(old)old.remove();
  app.querySelectorAll('.view').forEach(x=>{if(x!==v&&!x.getAnimations().length)x.remove()});
  return v;
}

function render(dir=0){
  const {id,i}=parse();
  if(!id) return home(dir);
  const p=P[id];
  if(i>=p.steps.length) return done(id,dir);
  step(id,i,dir);
}

function home(dir){
  const v=show(`<header class="hh"><div><h1>${U.what}</h1><p>${U.tap}</p></div>${b112(1)}</header>
    <main class="grid">${ORDER.map((id,k)=>{const p=P[id];const w=false;const red=id==='rcp';
      return `<button class="tile ${red?'red':''}" data-go="${id}" style="--tc:${p.c};animation-delay:${k*30}ms"><div class="ico"><svg viewBox="0 0 64 64">${p.icon}</svg></div><span>${p.label}</span>${w?'<small>RCP ›</small>':''}</button>`}).join('')}</main>
    <footer class="foot"><select data-lang aria-label="Language">${Object.entries(LANGS).map(([k,x])=>`<option value="${k}" ${k===LANG?'selected':''}>${x.name}</option>`).join('')}</select>
    <button data-num>${U.number}: <b>${NUMBER}</b> · ${U.change}</button></footer>
    <p class="disc">${fmt(U.disc)}</p>`,dir);
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{unlock();nav(`#/${b.dataset.go}/0`)});
  v.querySelector('[data-lang]').onchange=e=>{LANG=e.target.value;try{localStorage.setItem('pa-lang',LANG)}catch{};hydrate();home(0)};
  v.querySelector('[data-num]').onclick=()=>{const n=prompt(U.ask,NUMBER);if(n&&/^[0-9+ ]{2,8}$/.test(n.trim())){NUMBER=n.trim();try{localStorage.setItem('pa-num',NUMBER)}catch{};hydrate();home(0)}};
}

function topbar(p,label){
  return `<div class="top"><button class="back" data-home>${I.chev}<span>${label||U.home}</span></button><div class="ttl">${p.title}</div>
    <button class="ib" data-voice aria-label="${U.voice}">${voice?I.spk:I.mute}</button>${b112()}</div>`;
}

function step(id,i,dir){
  const p=P[id],s=p.steps[i],n=p.steps.length,last=i===n-1;
  const prog=n>1?`<div class="prog">${p.steps.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`:'';
  let body='';
  if(s.type==='choice'){
    body=`<div class="choice"><h2>${s.t}</h2><p class="hint">${s.s}</p>${s.opts.map((o,k)=>`<button class="opt" data-go="${o.go}" style="--oc:${o.c};animation-delay:${80+k*60}ms"><div class="oi"><svg viewBox="0 0 64 64">${o.i}</svg></div><div><b>${o.l}</b><small>${o.d}</small></div></button>`).join('')}</div>`;
  }else{
    let main;
    if(s.type==='metro') main=`<div class="metro"><div class="mtime">0:00</div><button class="ib mmute" data-beep>${I.spk}</button>
        <div class="beat"><div class="ringb"></div><div class="core"><div class="cnt">1</div></div></div>
        <div class="mlbl">${U.push}</div><div class="msub">${U.metro1}<br>${U.metro2}</div></div>`;
    else if(s.type==='timer') main=`<div class="timer"><div class="tring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#2c2c2e" stroke-width="6"/><circle class="tp" cx="50" cy="50" r="44" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset 1s linear"/></svg><div class="tv">0:00</div></div>
        <a class="b112 big alert" href="tel:${NUMBER}">${I.phone}${fmt(U.callN)}</a></div>`;
    else{
      const vid=s.a==='repeat'?REP.repeat[id][0]:VID[s.a];
      const ov=OV[s.a]?`<div class="ov">${OV[s.a]()}</div>`:'';
      main=vid?`<div class="art"><video src="media/${vid}.mp4" autoplay muted playsinline ${s.a==='repeat'?'':'loop'} preload="auto"></video>${ov}</div>`
              :`<div class="art"><svg viewBox="0 0 240 200">${A[s.a](s.spk)}</svg></div>`;
    }
    body=`<div class="stage">${main}<div class="txt"><div class="num">${i+1}</div><div><h2>${s.t}</h2><p>${s.s}</p></div></div>
      ${s.link?`<button class="link" data-go="${s.link.go}" style="--lc:${s.link.c||'var(--red)'}">${s.link.l} ›</button>`:''}</div>
      <div class="nav"><button class="prev" ${i===0?'disabled':''} aria-label="${U.prev}">${I.chev}</button>
      ${s.type==='metro'?'':`<button class="next">${last?U.done:U.next} ${I.chevr}</button>`}</div>`;
  }
  const v=show(topbar(p)+prog+body,dir,p.c);
  v.querySelector('[data-home]').onclick=()=>{history.pushState({n:++cur},'','#/');render(-1)};
  v.querySelector('[data-voice]').onclick=e=>{voice=!voice;try{localStorage.setItem('pa-voice',voice?'1':'0')}catch{};e.currentTarget.innerHTML=voice?I.spk:I.mute;voice?say(s.t+'. '+s.s,`${id}_${i}`):stopVoice()};
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{unlock();nav(`#/${b.dataset.go}/0`)});
  const nx=v.querySelector('.next');if(nx)nx.onclick=()=>{unlock();nav(`#/${id}/${i+1}`)};
  const pv=v.querySelector('.prev');if(pv)pv.onclick=()=>history.back();
  // swipe
  const st=v.querySelector('.stage');if(st){let x0=null;st.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
    st.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-60&&nx)nx.click();else if(dx>60&&i>0)history.back()})}
  const vd=v.querySelector('video');
  if(vd){
    vd.addEventListener('error',()=>{vd.parentNode.innerHTML=`<svg viewBox="0 0 240 200">${A[s.a](s.spk)}</svg>`},{once:true});
    if(s.a==='repeat'){const L=REP.repeat[id];let k=0;vd.addEventListener('ended',()=>{k=(k+1)%L.length;vd.src=`media/${L[k]}.mp4`;vd.play().catch(()=>{})})}
    vd.play().catch(()=>{});
  }
  const nx2=p.steps[i+1];if(nx2&&nx2.a&&VID[nx2.a]){const l=document.createElement('link');l.rel='prefetch';l.href=`media/${VID[nx2.a]}.mp4`;v.appendChild(l)}
  if(s.type==='metro')metro(v);
  if(s.type==='timer')timer(v,s.limit);
  say(s.t+'. '+s.s,`${id}_${i}`);
  wake();
}

function done(id,dir){
  const p=P[id];
  const v=show(topbar(p)+`<div class="done"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#30d158" style="animation:circlepop .6s cubic-bezier(.34,1.56,.64,1) both"/><path d="M30 51l13 13 27-28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" style="animation:checkdraw .5s cubic-bezier(.32,.72,0,1) .35s both"/></svg>
    <h2>${U.stay}</h2><p>${fmt(U.stay2)}</p>
    <div class="nav"><button class="prev" data-h aria-label="${U.home}">${I.home}</button><a class="next" href="tel:${NUMBER}" style="text-decoration:none;background:var(--red);color:#fff">${I.phone} ${fmt(U.callN)}</a></div></div>`,dir,p.c);
  v.querySelector('[data-home]').onclick=v.querySelector('[data-h]').onclick=()=>{history.pushState({n:++cur},'','#/');render(-1)};
  v.querySelector('[data-voice]').onclick=e=>{voice=!voice;e.currentTarget.innerHTML=voice?I.spk:I.mute};
  say(U.stay+'. '+U.stay2.replace(/<br>/g,' '),'done');
}

/* =============== Voice, audio, wake lock =============== */
const vo=new Audio();vo.preload='auto';
function stopVoice(){try{vo.pause();speechSynthesis.cancel()}catch{}}
function say(t,file){
  if(!voice)return;
  stopVoice();
  if(file){vo.src=`voice/${LANG}/${file}.m4a`;vo.onerror=()=>tts(t);vo.play().catch(()=>{});return}
  tts(t);
}
function tts(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/→/g,', ').replace(/·/g,','));u.lang=LANG;u.rate=1.02;
    const es=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(LANG));if(es)u.voice=es;speechSynthesis.speak(u)}catch{}
}
let ac=null;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch{}}
function beep(f=1100){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.35,ac.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}
let wl=null;async function wake(){try{if(!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&parse().id)wake()});

function metro(v){
  const cnt=v.querySelector('.cnt'),core=v.querySelector('.core'),rb=v.querySelector('.ringb'),tm=v.querySelector('.mtime'),mb=v.querySelector('[data-beep]');
  let k=0,on=true,t0=Date.now();
  mb.onclick=()=>{on=!on;mb.innerHTML=on?I.spk:I.mute;unlock()};
  const tick=()=>{k=k%30+1;cnt.textContent=k;
    core.animate([{transform:'scale(1)'},{transform:'scale(.86)',offset:.3},{transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.32,.72,0,1)'});
    rb.animate([{transform:'scale(.9)',opacity:1},{transform:'scale(1.08)',opacity:0}],{duration:520,easing:'ease-out'});
    if(on){beep(k===30?1500:1100);try{navigator.vibrate&&navigator.vibrate(40)}catch{}}
    const s=Math.floor((Date.now()-t0)/1000);tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
  const h=setInterval(tick,545);tick();cleanup.push(()=>clearInterval(h));
}
function timer(v,limit){
  const tv=v.querySelector('.tv'),tp=v.querySelector('.tp'),box=v.querySelector('.timer');const t0=Date.now();
  const up=()=>{const s=Math.floor((Date.now()-t0)/1000);tv.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    tp.style.strokeDashoffset=Math.max(0,100-s/limit*100);if(s>=limit&&!box.classList.contains('late')){box.classList.add('late');tp.style.stroke='var(--red)';say(fmt(U.late),'late')}};
  const h=setInterval(up,250);up();cleanup.push(()=>clearInterval(h));
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
history.replaceState({n:cur},'',location.hash||'#/');
render(0);
</script>
</body>
</html>
